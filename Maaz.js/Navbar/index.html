<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar Designing</title>

    <link rel="stylesheet" href="style.css">
    <script defer src="sketch.js"></script>
</head>

<body>
    <!-- ☰  -->
    <button id="menu-toggle" aria-label="Toggle sidebar" aria-expanded="false" aria-controls="navbar"><img src="./public/Hamburger.jpg" alt="Menu" style="width: 24px; height: 24px;"></button>

    <nav id="navbar">
        <ul>
            <li id="home-li"><a href="#" class="active-link" aria-current="page">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

    <div id="overlay" aria-hidden="true"></div>

    <main>
        <h1>Welcome to My Website</h1>
        <p>This is a sample webpage with a responsive navigation bar.</p>
    </main>
</body>

</html>
