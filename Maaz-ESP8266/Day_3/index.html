<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic Signal</title>
</head>

<body>
    <style>
        #container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            height: 100vh;
            background-color: #f0f0f0;

            /* font-size: 1.6rem; */
        }

        #header-guide {
            text-align: center;
            margin-top: 2rem;
            border: 2px solid black;
            padding: 1rem;
            background-color: lightcyan;
            width: 50%;
            min-width: fit-content;
            max-height: 20%;
            min-height: fit-content;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #header-guide h1 {
            color: red;
        }

        #header-guide p {
            font-size: 1.5rem;
            margin: 0.5rem 0;
        }

        #tresspass-message {
            font-size: 1.5rem;
            color: red;
            border: 2px solid red;
            padding: 1rem;
            background-color: lightcoral;
            width: 50%;
            min-width: fit-content;
            max-height: 20%;
            min-height: fit-content;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #signals {
            display: flex;
            flex-direction: row;
            justify-content: flex-start;
            align-items: center;
            background-color: black;
            width: 12rem;
            height: 4rem;
        }

        #signals div {
            width: 2rem;
            height: 2rem;
            margin: 0 1rem;

            flex-shrink: 4;
        }

        #red-signal {
            background-color: red;
            border-radius: 50%;
            box-shadow: 0 0 20px red;
        }

        #yellow-signal {
            background-color: yellow;
            border-radius: 50%;
            box-shadow: 0 0 20px yellow;
        }

        #green-signal {
            background-color: green;
            border-radius: 50%;
            box-shadow: 0 0 20px green;
        }

        .off-signal {
            background-color: rgba(255, 255, 255, 0.2) !important;
            box-shadow: none !important;
        }

        .go-message {
            font-size: 1.5rem;
            color: green;
            border: 2px solid green;
            padding: 1rem;
            background-color: lightgreen;
            width: 50%;
            min-width: fit-content;
            max-height: 20%;
            min-height: fit-content;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .stop-message {
            font-size: 1.5rem;
            color: red;
            border: 2px solid red;
            padding: 1rem;
            background-color: lightcoral;
            width: 50%;
            min-width: fit-content;
            max-height: 20%;
            min-height: fit-content;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .alert-message {
            font-size: 1.5rem;
            color: orange;
            border: 2px solid orange;
            padding: 1rem;
            background-color: lightyellow;
            width: 50%;
            min-width: fit-content;
            max-height: 20%;
            min-height: fit-content;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
    </style>

    <div id="container">
        <div id="header-guide">
            <h1>Traffic Signal</h1>
            <p style="color: #d00;">Red Light: Stop</p>
            <p style="color: #bb0;">Yellow Light: Get Ready</p>
            <p style="color: #0d0;">Green Light: Go</p>
        </div>

        <div id="tresspass-message" style="display: none;">
            You Tresspass the Signal! You will be fined by the traffic police. Please follow the traffic rules and stay
            safe on the road.
        </div>

        <div id="signals">
            <div id="red-signal"></div>
            <div id="yellow-signal"></div>
            <div id="green-signal"></div>
        </div>

        <div id="message" class="go-message">
            Ready to Go!
        </div>
    </div>

    <script>
        const messages = Object.freeze({
            red: "Stop! Don't Move!",
            yellow: "Get Ready! Prepare to Stop!",
            green: "Go! You can move now."
        });

        const status = Object.freeze({
            red: "stop-message",
            yellow: "alert-message",
            green: "go-message"
        });

        const signal = "red yellow green".split(" ").reduce((acc, color) => {
            acc[color] = {
                element: document.getElementById(`${color}-signal`),
                message: messages[color],
                status: status[color]
            };
            return acc;
        }, {});

        console.log(signal);

        function setSignal(color) {
            for (const key in signal) {
                const element = signal[key].element;
                if (key === color)
                    element.classList.remove("off-signal");
                else
                    element.classList.add("off-signal");
            }
        }

        function setMessage(message, color) {
            this.messageElement = document.getElementById("message");
            this.messageElement.innerHTML = message;
            this.messageElement.className = signal[color].status;
        }

        function handleTresspass() {
            clearInterval(signalInterval);
            setSignal("red");
            setMessage("Stop! Don't Move!", "red");
            document.getElementById("tresspass-message").style.display = "flex";
            sessionStorage.setItem("tresspass", "true");
        }

        function checkTresspass() {
            fetch("/tresspass")
                .then(response => { response.json().then(data => { console.log(data); return data; }).catch(() => Promise.resolve({ tresspass: false })); })
                .then(data => {
                    if (data?.tresspass) {
                        handleTresspass();
                    }
                })
                .catch(error => console.error("Error checking tresspass:", error));
        }

        let currentSignal = "red";
        let signalInterval;

        // Check if tresspass was previously detected
        if (sessionStorage.getItem("tresspass") === "true") {
            handleTresspass();
        } else {
            setSignal(currentSignal);
            setMessage(signal[currentSignal].message, currentSignal);

            signalInterval = setInterval(() => {
                setMessage(signal[currentSignal].message, currentSignal);
                setSignal(currentSignal);

                currentSignal = currentSignal === "red" ? "green" : currentSignal === "yellow" ? "red" : "yellow";
            }, 1000);

            // Poll for tresspass every 500ms during red light
            setInterval(() => {
                if (currentSignal === "red") {
                    checkTresspass();
                }
            }, 500);
        }
    </script>
</body>

</html>
